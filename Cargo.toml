[package]
name = "zimaforge"
version = "0.6.3"
edition = "2024"
rust-version = "1.89"
description = "Mod framework for the ZimaOS dashboard – a single, fast Rust binary in the ora design."
license = "MIT"
repository = "https://github.com/MarcelRuh/zimaforge"
readme = "README.md"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query", "macros"] }
bytes = "1.12"
hex = "0.4"
http-body-util = "0.1"
hyper = { version = "1.12", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
mime_guess = "2.0"
rust-embed = { version = "8.14", features = ["mime-guess"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "fs", "io-util", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["fs", "trace", "set-header", "limit", "compression-gzip", "compression-br"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }


[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
tempfile = "3.27"
tokio-tungstenite = "0.30"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
