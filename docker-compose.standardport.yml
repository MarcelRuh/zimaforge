# ZimaForge auf dem Standardport 80 – ZimaOS läuft dahinter auf 8081.
# Voraussetzung: In ZimaOS unter Einstellungen den Dashboard-Port auf 8081 stellen
# (sonst ist Port 80 belegt und ZimaForge startet nicht).
# Fallback, falls ZimaForge nicht läuft: http://<ZIMAOS-IP>:8081
name: zimaforge

services:
  zimaforge:
    image: ghcr.io/marcelruh/zimaforge:0.6.0
    container_name: zimaforge
    # Host-Netzwerk: ZimaForge belegt Port 80 und erreicht ZimaOS auf 127.0.0.1:8081.
    network_mode: host
    restart: unless-stopped
    # Gehärtet: keine Rechteausweitung, und Capabilities, die ZimaForge nie braucht, sind weg.
    # Bewusst behalten: Dateirechte (DAC_OVERRIDE, CHOWN, FOWNER) – sonst könnte ZimaForge
    # einen /DATA-Ordner, der nicht root gehört, nicht mehr beschreiben – und NET_BIND_SERVICE
    # für Ports unter 1024 (Standardport-Variante).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
      - MKNOD
      - AUDIT_WRITE
      - SYS_CHROOT
      - SETFCAP
      - SETPCAP
      - SETUID
      - SETGID
      - FSETID
      - KILL
    environment:
      ZIMAFORGE_PORT: "80"
      ZIMAFORGE_UPSTREAM: http://127.0.0.1:8081
      ZIMAFORGE_LOG: info
    volumes:
      - type: bind
        source: /DATA/AppData/zimaforge
        target: /data
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
      # Optional – App-Namen in Forge Pulse (Apps-Liste). Pfad = Docker-Root + /containers,
      # prüfen mit: docker info --format '{{.DockerRootDir}}'
      # - type: bind
      #   source: /var/lib/docker/containers
      #   target: /host/docker/containers
      #   read_only: true
    labels:
      icon: https://raw.githubusercontent.com/MarcelRuh/zimaforge/main/assets/icon.png

x-casaos:
  architectures:
    - amd64
    - arm64
  main: zimaforge
  author: MarcelRuh
  developer: MarcelRuh
  category: Utilities
  icon: https://raw.githubusercontent.com/MarcelRuh/zimaforge/main/assets/icon.png
  index: /?forge
  port_map: "80"
  scheme: http
  store_app_id: zimaforge
  title:
    en_us: ZimaForge
    de_de: ZimaForge
  tagline:
    en_us: Forge your ZimaOS dashboard with mods
    de_de: Mods für dein ZimaOS-Dashboard
  description:
    en_us: >-
      ZimaForge sits in front of the ZimaOS dashboard and loads JavaScript and CSS mods.
      Single Rust binary, built-in mod store, ZimaMOD-compatible, secured by your ZimaOS login.
    de_de: >-
      ZimaForge sitzt vor dem ZimaOS-Dashboard und lädt JavaScript- und CSS-Mods.
      Ein einzelnes Rust-Binary, eingebauter Mod-Store, ZimaMOD-kompatibel, abgesichert über die ZimaOS-Anmeldung.
  tips:
    before_install:
      en_us: >-
        Before installing, move the ZimaOS dashboard to port 8081: in ZimaOS open Settings,
        set the dashboard port to 8081 and then open http://<ZIMAOS-IP>:8081.
        Otherwise port 80 is taken and ZimaForge will not start.
        Afterwards http://<ZIMAOS-IP>/ is your dashboard with mods;
        if ZimaForge is not running, ZimaOS stays reachable at http://<ZIMAOS-IP>:8081.
      de_de: >-
        Vor der Installation das ZimaOS-Dashboard auf Port 8081 legen: in ZimaOS unter Einstellungen
        den Dashboard-Port auf 8081 stellen und danach http://<ZIMAOS-IP>:8081 öffnen.
        Sonst ist Port 80 belegt und ZimaForge startet nicht.
        Danach ist http://<ZIMAOS-IP>/ dein Dashboard mit Mods;
        läuft ZimaForge nicht, bleibt ZimaOS unter http://<ZIMAOS-IP>:8081 erreichbar.
  version: "0.6.0"
  repo: https://github.com/MarcelRuh/zimaforge
  support: https://github.com/MarcelRuh/zimaforge/issues
