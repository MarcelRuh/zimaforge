name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  javascript:
    name: JavaScript-Syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: node --check
        run: |
          set -e
          for f in runtime/*.js; do node --check --input-type=module < "$f"; echo "ok $f"; done
          for f in $(find mods examples -name '*.js'); do node --check "$f"; echo "ok $f"; done

  docker:
    name: Docker-Build (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: zimaforge:ci
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Smoke-Test
        run: |
          set -eu
          docker run --rm zimaforge:ci --version
          # Wie in den Compose-Dateien: ohne Capabilities, ohne Rechteausweitung.
          docker run -d --name zf -p 8077:8077 \
            --cap-drop NET_RAW --cap-drop MKNOD --cap-drop AUDIT_WRITE --cap-drop SYS_CHROOT --cap-drop SETFCAP --cap-drop SETPCAP --cap-drop SETUID --cap-drop SETGID --cap-drop FSETID --cap-drop KILL --security-opt no-new-privileges zimaforge:ci
          ok=
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8077/_forge/api/health && ok=1 && break
            sleep 1
          done
          test -n "$ok" || { echo "::error::/_forge/api/health antwortet nicht"; exit 1; }
          echo
          store="$(curl -fsS http://127.0.0.1:8077/_forge/api/store)"
          grep -q forge-pulse <<<"$store" || { echo "::error::Katalog ohne forge-pulse"; exit 1; }
          loader="$(curl -fsS http://127.0.0.1:8077/_forge/runtime/loader.js)"
          grep -q ZimaForge <<<"$loader" || { echo "::error::loader.js fehlt"; exit 1; }
          # Docker-HEALTHCHECK (/zimaforge healthcheck) muss "healthy" melden.
          health=
          for i in $(seq 1 40); do
            health="$(docker inspect --format '{{.State.Health.Status}}' zf)"
            [ "$health" = healthy ] && break
            [ "$health" = unhealthy ] && break
            sleep 1
          done
          echo "Docker-Health: $health"
          test "$health" = healthy || { echo "::error::Container ist nicht healthy ($health)"; exit 1; }
      - name: Container-Logs bei Fehler
        if: failure()
        run: |
          docker logs zf || true
          docker inspect --format '{{json .State}}' zf || true
      - name: Container entfernen
        if: always()
        run: docker rm -f zf || true
