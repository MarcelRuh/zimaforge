<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZimaForge · Gateway nicht erreichbar</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: radial-gradient(circle at 20% 0%, #8338ec33, transparent 50%),
                radial-gradient(circle at 100% 100%, #ff006e22, transparent 45%), #0a0a0f;
    color: #fff; font: 15px/1.55 system-ui, "Segoe UI", sans-serif;
  }
  main {
    max-width: 30rem; margin: 1rem; padding: 2rem; border: 1px solid #8338ec5a;
    border-radius: 6px; background: #0d0d15e6; box-shadow: 0 0 40px #8338ec30;
  }
  .kicker { color: #00b4d8; letter-spacing: .2em; font-size: .72rem; font-weight: 700; text-transform: uppercase; }
  h1 { margin: .35rem 0 .75rem; font-size: 1.4rem; letter-spacing: .04em; }
  p { color: #a0a0b8; margin: 0 0 1.25rem; }
  button {
    font: inherit; font-weight: 600; color: #fff; background: #ff006e; border: 0;
    padding: .6rem 1.2rem; border-radius: 4px; cursor: pointer; box-shadow: 0 0 18px #ff006e66;
  }
  button:hover { background: #ff2d8a; }
</style>
</head>
<body>
<main>
  <div class="kicker">ZimaForge</div>
  <h1>ZimaOS-Gateway nicht erreichbar</h1>
  <p>ZimaForge läuft, bekommt aber keine Antwort vom ZimaOS-Dashboard. Startet ZimaOS gerade neu? Prüfe sonst die Variable <code>ZIMAFORGE_UPSTREAM</code>.</p>
  <button type="button" onclick="location.reload()">Erneut versuchen</button>
</main>
</body>
</html>
